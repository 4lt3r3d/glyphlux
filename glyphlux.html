:root{
  --bg:#030604;--dim:#0e4d25;--mid:#22a64e;--lit:#3dff7a;--hot:#dcffe6;
  --f:"Departure Mono","Cascadia Mono",Consolas,"Lucida Console","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;background:var(--bg);color:var(--mid);font:11px/15px var(--f);overflow:hidden}
body{display:grid;grid-template-columns:316px 1fr}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:1px solid var(--hot);outline-offset:0}
::selection{background:var(--lit);color:var(--bg)}

/* ---- rack (sidebar) ---- */
#rack{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--dim);user-select:none}
#head{display:grid;grid-template-columns:auto 1fr;column-gap:9px;padding:7px 6px 6px 7px;border-bottom:1px solid var(--dim)}
#mark{display:block;width:156px;height:20px;image-rendering:pixelated}
#head .id{color:var(--lit);line-height:10px;padding-top:0}
#head .id span{display:block;color:var(--mid);margin-top:3px}
#read{grid-column:1/3;margin-top:7px;color:var(--mid);white-space:pre;overflow:hidden}
#read b{font-weight:normal;color:var(--lit)}
#scroll{flex:1;min-height:0;overflow-y:scroll;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--dim) var(--bg)}
#scroll::-webkit-scrollbar{width:7px}
#scroll::-webkit-scrollbar-track{background:var(--bg);border-left:1px solid var(--dim)}
#scroll::-webkit-scrollbar-thumb{background:var(--dim)}
#stat{border-top:1px solid var(--dim);padding:3px 7px 4px;color:var(--lit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stat::before{content:"> ";color:var(--mid)}
#zbar{display:grid;grid-template-columns:15px 1fr 15px 26px 34px;column-gap:3px;align-items:center;padding:3px 7px;border-top:1px solid var(--dim)}
.zb{height:13px;line-height:11px;text-align:center;border:1px solid var(--dim);color:var(--lit)}
.zb:hover{background:var(--lit);color:var(--bg);border-color:var(--lit)}
#keys{padding:3px 7px 5px;color:var(--mid);border-top:1px solid var(--dim)}
#keys b{font-weight:normal;color:var(--lit)}

details{border-bottom:1px solid var(--dim)}
summary{list-style:none;display:flex;justify-content:space-between;cursor:pointer;padding:2px 7px 2px 7px;color:var(--lit)}
summary::-webkit-details-marker{display:none}
summary::after{content:"[+]";color:var(--mid)}
details[open]>summary{background:var(--dim);color:var(--hot)}
details[open]>summary::after{content:"[-]";color:var(--hot)}
.body{margin:5px 0 9px 13px;padding:0 6px 0 8px;border-left:1px solid var(--dim)}
.row{display:grid;grid-template-columns:96px 1fr;column-gap:6px;align-items:center;min-height:15px;margin:2px 0}
.row>label{white-space:nowrap;overflow:hidden}
.row.wide{grid-template-columns:1fr}
.sub{margin:9px 0 2px -9px;padding-left:8px;display:grid;grid-template-columns:1fr auto;color:var(--lit);border-top:1px solid var(--dim);padding-top:4px}
.sub:first-child{margin-top:0;border-top:0;padding-top:0}
.note{color:var(--mid);margin:2px 0;white-space:normal}
.note b{font-weight:normal;color:var(--lit)}

/* bar slider */
.s{display:grid;grid-template-columns:1fr 38px;align-items:center;cursor:ew-resize;touch-action:pan-y}
.s u{display:block;position:relative;height:9px;border:1px solid var(--dim);border-width:1px 0 1px 1px;text-decoration:none}
.s i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--dim)}
.s i::after{content:"";position:absolute;right:-1px;top:-3px;bottom:-3px;width:2px;background:var(--lit)}
.s b{font-weight:normal;color:var(--lit);text-align:right;pointer-events:none}
.s:hover u,.s:focus-visible u{border-color:var(--mid)}

/* segmented / cycle / toggle */
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--dim);border-right:0;border-bottom:0}
.seg button{flex:1 0 auto;text-align:center;padding:0 4px;height:13px;line-height:12px;border-right:1px solid var(--dim);border-bottom:1px solid var(--dim)}
.seg button[aria-pressed=true]{background:var(--lit);color:var(--bg)}
.seg button:hover{color:var(--hot)}
.seg button[aria-pressed=true]:hover{color:var(--bg)}
.cyc{display:flex;justify-content:space-between;width:100%;height:15px;line-height:13px;border:1px solid var(--dim);padding:0 3px;color:var(--lit)}
.cyc::before{content:"<";color:var(--mid)}
.cyc::after{content:">";color:var(--mid)}
.cyc:hover{border-color:var(--mid)}
.tog{color:var(--mid);white-space:nowrap}
.tog[aria-pressed=true]{color:var(--lit)}
.tog::before{content:"[ ] "}
.tog[aria-pressed=true]::before{content:"[x] "}
.act{border:1px solid var(--mid);color:var(--lit);padding:0 5px;height:15px;line-height:13px;text-align:center}
.act:hover{background:var(--lit);color:var(--bg);border-color:var(--lit)}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts .act{flex:1 0 auto}
input[type=text],input[type=number]{width:100%;height:15px;border:1px solid var(--dim);padding:0 3px;color:var(--lit);background:var(--bg);-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus{border-color:var(--lit)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* audio */
.route{display:grid;grid-template-columns:58px 100px 1fr;column-gap:3px;margin:2px 0}
.meter{display:grid;grid-template-columns:34px 1fr;column-gap:6px;align-items:center;height:11px}
.meter div{height:5px;border-left:1px solid var(--mid);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--lit)}

.sw{appearance:none;-webkit-appearance:none;width:22px;height:15px;padding:0;border:1px solid var(--mid);background:none;cursor:pointer;display:block}
.sw::-webkit-color-swatch-wrapper{padding:0}
.sw::-webkit-color-swatch{border:0;border-radius:0}
.sw::-moz-color-swatch{border:0;border-radius:0}
.strip{display:flex;flex-wrap:wrap;gap:2px}
.fxh{display:grid;grid-template-columns:auto 1fr auto auto auto;column-gap:3px;align-items:center;margin:7px 0 2px -9px;padding:4px 0 0 8px;border-top:1px solid var(--dim)}
.fxh .tog::before{content:"[ ]"}
.fxh .tog[aria-pressed=true]::before{content:"[x]"}
.fxn{color:var(--lit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxn:hover{color:var(--hot)}
.mini{width:15px;height:13px;line-height:11px;text-align:center;border:1px solid var(--dim);color:var(--mid)}
.mini:hover{background:var(--lit);color:var(--bg);border-color:var(--lit)}
.fxb{margin-bottom:4px}
.addfx{display:grid;grid-template-columns:1fr 52px;column-gap:4px;margin:2px 0 4px}
.snip{width:100%;border:1px solid var(--dim);background:var(--bg);color:var(--mid);font:inherit;resize:vertical;padding:2px 3px;word-break:break-all}
a{color:var(--lit);text-decoration:underline;text-underline-offset:2px}
a:hover{background:var(--lit);color:var(--bg)}
body.play{grid-template-columns:1fr;grid-template-rows:1fr}
body.play #rack{display:none}
body.play #cv{cursor:default}
/* ---- stage ---- */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
body.pan #cv{cursor:grab}
body.panning #cv{cursor:grabbing}
body.placing #cv{cursor:move}
#dims{position:absolute;right:6px;bottom:4px;color:var(--mid);pointer-events:none}
#tab{display:none}
body.hid{grid-template-columns:15px 1fr}
body.hid #rack>*{display:none}
body.hid #tab{display:block;width:14px;height:100%;color:var(--lit);text-align:center}
body.drop #stage::after{content:"drop: image video gif glsl obj gltf nfo ans audio palette scene";position:absolute;left:0;top:0;padding:2px 7px;background:var(--lit);color:var(--bg)}
@media(max-width:720px){
  body{grid-template-columns:1fr;grid-template-rows:52vh 1fr}
  #stage{grid-row:1}
  #rack{grid-row:2;border-right:0;border-top:1px solid var(--dim)}
  body.hid{grid-template-columns:1fr;grid-template-rows:1fr 16px}
  body.hid #tab{width:100%;height:15px}
}

  if(file.type.startsWith('video/')||/\.(mp4|webm|mov|m4v)$/i.test(file.name)){const v=document.createElement('video');v.loop=P.vidLoop;v.playsInline=true;v.src=url;
    L.vid=v;L.kind='video';
    if(P.vidAudio){try{ensureAC();L.vsrc=AC.createMediaElementSource(v);L.vsrc.connect(tap);L.vsrc.connect(AC.destination)}catch(e){}}
    v.muted=!P.vidAudio;v.volume=P.vidVol;
    v.play().catch(()=>say(file.name+' loaded. press play in the video section'));vidSync()}
  else if((file.type==='image/gif'||/\.gif$/i.test(file.name))&&'ImageDecoder'in window){
    try{const dec=new ImageDecoder({data:await file.arrayBuffer(),type:'image/gif'});await dec.tracks.ready;const n=Math.min(dec.tracks.selectedTrack.frameCount,400);L.frames=[];L.total=0;
      for(let i=0;i<n;i++){const r=await dec.decode({frameIndex:i}),dur=Math.max(20,(r.image.duration||1e5)/1000);L.frames.push({bmp:await createImageBitmap(r.image),t:L.total,dur});L.total+=dur;r.image.close()}
      L.kind='gif';dec.close()}

  else{L.bmp=await createImageBitmap(file);L.kind='image';if(/\.gif$/i.test(file.name))say('gif loaded as a still: this browser has no ImageDecoder')}}

/* ---- camera. getUserMedia, local device only. one layer in the fx stack; rgb is kept so color.by source shows the camera's own colours.
   flips + brightness/contrast are applied when the frame is drawn, so they still work on a frozen frame. */
let camL=null,camBusy=false;

  if(P.camFreeze){if(!L.snap&&live){const s=document.createElement('canvas');s.width=v.videoWidth;s.height=v.videoHeight;s.getContext('2d').drawImage(v,0,0);L.snap=s}}

  if(src){const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height,k=['cover','contain','stretch'].indexOf(L.c.variant);
    let dw=W,dh=H;if(k!==2){const r=k===0?Math.max(W/sw,H/sh):Math.min(W/sw,H/sh);dw=sw*r;dh=sh*r}dw*=L.c.scale;dh*=L.c.scale;
    const fh=P.camFlipH,fv=P.camFlipV;x.save();x.setTransform(fh?-1:1,0,0,fv?-1:1,fh?L.bw:0,fv?L.bh:0);
    if(P.camBright!==1||P.camCon!==1)x.filter='brightness('+P.camBright+') contrast('+P.camCon+')';
    x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(src,(W-dw)/2*L.kx,(H-dh)/2*L.ky,dw*L.kx,dh*L.ky);x.restore()}

async function camStart(){
  if(camL||camBusy)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('this browser has no camera access (getUserMedia)');return}
  camBusy=true;if(ui.cam)ui.cam.textContent='starting...';let st;
  try{st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false})}
  catch(e){camBusy=false;camUI();say('camera blocked: '+(e.name||e)+'. needs permission, and https / localhost / a local file');return}
  camBusy=false;
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=st;v.play().catch(()=>{});
  const tr=st.getVideoTracks()[0],L=addFx('camera',{blend:'max',level:1,name:(tr&&tr.label)||'webcam'});L.cam=v;L.stream=st;camL=L;
  if(tr)tr.addEventListener('ended',()=>{if(camL===L){removeFx(L);renderFx();say('camera disconnected')}});
  renderFx();ui.fxSec.open=true;camUI();
  const s=tr&&tr.getSettings?tr.getSettings():{};say('camera live'+(s.width?' '+s.width+'x'+s.height:'')+' > layer '+FX.length+' in effects')}
function camStop(L){
  if(L.stream)L.stream.getTracks().forEach(t=>t.stop());L.stream=null;if(L.cam){L.cam.pause();L.cam.srcObject=null}L.snap=null;
  if(camL===L){camL=null;camUI()}}
function camToggle(){if(camL){removeFx(camL);renderFx();say('camera off')}else camStart()}
function camUI(){if(ui.cam)ui.cam.textContent=camL?'stop camera':'start camera';
  if(ui.camn)ui.camn.textContent=camL?'live: '+(camL.c.name||'webcam')+'. it is a layer in effects.':'off. starts as its own layer in effects, next to any image / video / shader layers.'}

const FXLIB=Object.keys(FXDEF).filter(k=>!FXDEF[k].file);
function addFx(type,cfg){
  const d=FXDEF[type];if(!d)return null;
  const c=Object.assign({type,on:true,open:true,level:d.kind==='warp'?.4:.8,blend:FX.length?'max':'add',speed:1,scale:1,p:.5,variant:d.variants?d.variants[0]:''},d.d||{},cfg||{});
  const L={c,def:d,t:0,dt:0};if(d.init)d.init(L);else if(d.upd)allocBuf(L);
  FX.push(L);if(!P.fx.includes(c))P.fx.push(c);return L}

  if(L.gl3){const e=L.gl3.getExtension('WEBGL_lose_context');e&&e.loseContext()}}

  const sp=P.speed*(1+mod.speed);FXA=[];WARPA=[];srcLayer=null;
  for(const L of FX){if(!L.c.on||L.c.level<=0)continue;const d=L.def;L.dt=paused?0:dt*sp*L.c.speed;L.t+=L.dt;L.lv=L.c.level;L.bl=BLEND.indexOf(L.c.blend);
    if(d.pre)d.pre(L);if(d.upd&&(!paused||!L.ran)){d.upd(L,dt);L.ran=true}
    if(d.kind==='warp')WARPA.push(L);else{L.f=d.fn||null;FXA.push(L);if(d.rgb&&L.rgb)srcLayer=L}}}

function step(dt){

  if(g>0&&Math.random()<g*.6){const r0=(Math.random()*gh)|0,hh=1+((Math.random()*gh*.1)|0),sh=(Math.random()-.5)*2*g*W*.22;
    for(let r=r0;r<Math.min(gh,r0+hh);r++)rowShift[r]=sh}
  for(const b of bursts)if(b.type===2){const r0=Math.max(0,((b.y-b.to)/ch)|0),r1=Math.min(gh-1,((b.y+b.to)/ch)|0);
    for(let r=r0;r<=r1;r++)if(Math.random()<.22*b.amp)rowShift[r]=(Math.random()-.5)*b.amp*b.to*b.force*.9}

    const N=Math.min(MAXP,P.count|0),fs=.0042*P.turb,spd=P.ptcSpeed*60,mm=P.mouseMode,dir=mm==='gravity'?-1:1;
    const act=mm==='repel'||mm==='gravity'||mm==='ripple';
    const mR=P.moveRadius,mF=(act?P.moveForce:0)*1500*dt,wl=P.waterOn?P.water*70:0;

function audioTick(dt){
  for(const k in mod)mod[k]=0;
  const live=an&&((audioEl&&!audioEl.paused)||micStream||FX.some(L=>L.vid&&!L.vid.paused&&!L.vid.muted));
  if(live){
    an.getByteFrequencyData(fbuf);const hz=AC.sampleRate/an.fftSize;
    const avg=(lo,hi)=>{const a=Math.max(1,Math.round(lo/hz)),b=Math.min(fbuf.length-1,Math.round(hi/hz));let s=0;for(let i=a;i<=b;i++)s+=fbuf[i];return s/((b-a+1)*255)};
    const raw={bass:avg(30,200),mid:avg(200,3000)*1.4,high:avg(3000,14000)*2.2};raw.amp=(raw.bass+raw.mid+raw.high)/3*1.15;
    for(const k of SRC){const v=clamp(raw[k]*P.sens,0,1.5);band[k]+=(v-band[k])*(v>band[k]?.92:P.release)}
  }else for(const k of SRC)band[k]*=.9;
  const now=performance.now();
  for(const k of SRC){slow[k]+=(band[k]-slow[k])*.04;onset[k]=(band[k]>slow[k]*1.25+.05&&now-cool[k]>110);}
  for(const r of P.routes){
    if(r.t==='none'||r.g<=0)continue;const l=band[r.s]*r.g;
    switch(r.t){
      case'wave.kick':if(onset[r.s]){cool[r.s]=now;if(!P.waterOn){P.waterOn=true;syncUI()}
        drop(W*(.15+Math.random()*.7),H*(.15+Math.random()*.7),10+l*22,.5+l*1.3)}break;
      case'shock.kick':if(onset[r.s]){cool[r.s]=now;disturb(W*(.25+Math.random()*.5),H*(.25+Math.random()*.5),clamp(l,0,1),'shock',.6+l)}break;
      case'displace':mod.disp+=l;break;
      case'bright':mod.bright+=l*.35;break;
      case'density':mod.density+=l*.45;break;
      case'glitch':mod.glitch+=l*.9;break;
      case'hot.color':mod.hot+=l;break;
      case'speed':mod.speed+=l*2;break;
      case'scale':mod.scale+=l*.9;break;
      case'logo.pop':mod.logo+=l*.8;break;
    }
  }
  if(ui.m)for(const k of SRC)ui.m[k].style.width=clamp(band[k]*100,0,100)+'%';
}

addEventListener('pointerup',e=>{if(e.button===2)rmb=false;endPan(e)});

  const n=el('div','s'),bar=el('u'),fill=el('i'),val=el('b');bar.append(fill);n.append(bar,val);n.tabIndex=0;n.setAttribute('role','slider');
  n.setAttribute('aria-valuemin',min);n.setAttribute('aria-valuemax',max);

  const paint=()=>{const v=get();fill.style.width=((v-min)/(max-min)*100)+'%';val.textContent=v.toFixed(dec);n.setAttribute('aria-valuenow',v)};
  const put=v=>{v=clamp(Math.round(v/step)*step,min,max);v=+v.toFixed(4);if(v!==get()){set(v);paint()}};
  const mv=e=>{const r=bar.getBoundingClientRect();put(min+(max-min)*clamp((e.clientX-r.left)/r.width,0,1))};

const lumOf=h=>{const c=hex(h);return c[0]*.299+c[1]*.587+c[2]*.114};

function parsePalette(txt){
  let cols=[];
  try{const j=JSON.parse(txt);if(j&&j.bg&&Array.isArray(j.stops))return{bg:j.bg,stops:j.stops.slice(0,16)};
    if(Array.isArray(j))cols=j.map(String);else if(j&&Array.isArray(j.colors))cols=j.colors.map(String)}catch(e){}
  if(!cols.length){
    if(/GIMP Palette/i.test(txt)){for(const ln of txt.split('\n')){const m=/^\s*(\d+)\s+(\d+)\s+(\d+)/.exec(ln);if(m)cols.push([1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join(''))}}
    else cols=txt.match(/\b[0-9a-f]{6}\b/gi)||[]}
  cols=[...new Set(cols.map(c=>'#'+c.replace('#','').slice(0,6).toLowerCase()).filter(c=>/^#[0-9a-f]{6}$/.test(c)))];
  if(cols.length<2)throw new Error('no palette found (need 2+ hex colours)');
  cols.sort((a,b)=>lumOf(a)-lumOf(b));const bg=cols.shift();
  if(cols.length>16){const o=[];for(let i=0;i<16;i++)o.push(cols[Math.round(i*(cols.length-1)/15)]);cols=o}
  return{bg,stops:cols}}

  b.s('decay','clickDecay',.2,3,.01,{when:()=>P.clickStyle!=='ripple'});
  b.tog('hold to charge (1.1s)','charge');
  b.sub('drag');
  b.s('radius','dragRadius',20,400,1);b.s('force','dragForce',0,3,.01);b.s('decay','dragDecay',.8,.995,.005);b.s('wake','dragWake',0,1,.01);
  b.sub('field');
  b.s('displacement','distort',0,90,1);
});

section('video',false,b=>{
  b.tog('keep audio','vidAudio',{re:'vid'});
  b.s('volume','vidVol',0,1,.01,{re:'vid',when:()=>P.vidAudio});
  b.s('rate','vidRate',.1,3,.01);
  b.tog('loop','vidLoop',{re:'vid'});
  const a=el('div','acts');
  a.append(actBtn('play all',()=>vidAll(v=>{ensureAC();v.play().catch(()=>{})})),
           actBtn('pause all',()=>vidAll(v=>v.pause())),
           actBtn('restart',()=>vidAll(v=>{v.currentTime=0})));
  b.raw('',a);
  ui.vidn=b.note('');
  b.note('video keeps its audio by default and feeds the same analyser as the audio section, so routing, meters and reactivity treat it exactly like a loaded track. an audio file and a video with sound can run at once.');
});

section('camera',false,b=>{
  ui.cam=actBtn('start camera',camToggle);b.raw('',ui.cam);
  ui.camn=b.note('');camUI();
  b.tog('flip horizontal','camFlipH');
  b.tog('flip vertical','camFlipV');
  b.s('brightness','camBright',0,3,.01);
  b.s('contrast','camCon',0,3,.01);
  b.tog('freeze frame','camFreeze');
  b.note('blend, level, zoom and gamma for the camera live on its layer in <b>effects</b>. set <b>color.by</b> to <b>source</b> to keep its real colours (with several image / video / camera layers on, the lowest one in the stack supplies colour). the stream never leaves this tab and is not saved into scenes or exports.');
});

section('cp437 / nfo',false,b=>{
  b.raw('ascii face',cycle(['mono','px437'],()=>P.face,v=>{P.face=v;setFace();say(v==='px437'?'ascii face: Px437 IBM VGA 8x16':'ascii face: mono')}));
  b.note('<b>px437</b> draws ascii mode with IBM VGA 8x16, all 256 cp437 glyphs. cells snap to 8x16 multiples so box drawing and blocks join (cell.size 8-12 = native 16px, crisp). pick the <b>cp437</b> char.ramp in render for the full set.');
  const a=el('div','acts');a.append(actBtn('load .nfo / .ans',filePick('.nfo,.ans,.diz,.asc',true,importFiles)));b.raw('',a);
  b.note('or drop the file anywhere. each one becomes a layer in <b>effects</b>, rasterised at 8x16 per character and then put through the pixel treatment. <b>.nfo .diz .asc</b> = cp437 text (utf-8 re-saves are mapped back). <b>.ans</b> = ansi colour + cursor codes, sauce width and ice colours honoured. set <b>color.by</b> to <b>source</b> to keep the ansi colours. tall files default to the <b>scroll</b> variant: layer speed sets the scroll rate.');
});

section('audio',false,(b,body)=>{
  const pick=filePick('audio/*',false,fl=>loadAudio(fl[0]));
  const acts=el('div','acts');
  ui.play=actBtn('play',()=>{if(!audioEl){pick();return}ensureAC();stopMic();if(audioEl.paused){audioEl.play();ui.play.textContent='pause'}else{audioEl.pause();ui.play.textContent='play'}});
  ui.mic=actBtn('use mic',toggleMic);
  acts.append(actBtn('load file',pick),ui.play,ui.mic);b.raw('',acts);
  ui.fname=b.note('no source. load a file, drop one on the canvas, or use mic.');
  b.tog('external audio on','extAudio',{re:'vid'});
  ui.m={};for(const k of SRC){const m=el('div','meter');m.append(el('span','',k));const t=el('div'),f=el('i');t.append(f);m.append(t);body.append(m);ui.m[k]=f}
  b.s('sensitivity','sens',.2,4,.01);b.s('release','release',.02,.6,.01);
  b.s('smoothing','smooth',0,.6,.01,{re:'smooth'});
  b.note('smoothing 0 = rawest, fastest response. release sets how fast a band falls back.');
  b.sub('routing  source > target  gain');
  P.routes.forEach((r,i)=>{const row=el('div','route');
    row.append(cycle(SRC,()=>r.s,v=>r.s=v),cycle(TGT,()=>r.t,v=>r.t=v),slider(0,3,.01,()=>r.g,v=>r.g=v,DEF.routes[i].g));body.append(row)});
});
section('import',false,b=>{
  const pick=filePick('image/*,video/*,audio/*,.gif,.glsl,.frag,.fs,.vert,.vs,.obj,.gltf,.glb,.bin,.json,.hex,.gpl,.nfo,.ans,.diz,.asc',true,importFiles);
  const a=el('div','acts');a.append(actBtn('load files',pick));b.raw('',a);
  b.note('or drop anywhere. each file becomes a layer in <b>effects</b> and is converted live into the active render style.');
  b.note('<b>image</b> png jpg gif webp  <b>video</b> mp4 webm<br><b>shader</b> .glsl .frag (shadertoy mainImage or plain main; iTime iResolution iMouse time resolution mouse + iBass iMid iHigh iAmp). .vert replaces the vertex stage.<br><b>model</b> .obj .glb .gltf (drop the .bin with it). no draco.<br><b>text</b> .nfo .ans .diz .asc (cp437)<br><b>audio</b> mp3 wav  <b>palette</b> .hex .gpl .json  <b>scene</b> .json');
});
section('export',false,b=>{
  b.sub('still');
  b.raw('',actBtn('save png',savePNG));
  b.sub('gif');
  b.s('seconds','gifSecs',.5,10,.5);b.s('fps','gifFps',5,30,1);b.s('max width','gifW',120,1280,20);
  b.raw('',actBtn('record gif',recordGif));
  b.sub('video');
  if(REC_FMTS.length>1)b.seg('format','recFmt',REC_FMTS);else b.note(REC_FMTS.length?'this browser records '+REC_FMTS[0]+' only.':'this browser has no MediaRecorder. video export is off.');
  b.s('fps','recFps',15,60,1);b.s('mbit/s','recMbps',2,40,1);b.tog('include audio','recAudio');
  ui.rec=actBtn('record video',toggleRec);b.raw('',ui.rec);
  b.sub('embed');
  const a=el('div','acts');a.append(actBtn('save player .html',()=>savePlayer('player')),actBtn('copy iframe snippet',makeSnippet));b.raw('',a);
  const u=el('input');u.type='text';u.spellcheck=false;u.placeholder='https://you.github.io/glyphlux/';u.value=P.embedUrl;u.oninput=()=>{P.embedUrl=u.value};b.raw('hosted url',u).title='where this file is hosted. the snippet points an iframe at it with the scene packed into the url.';
  ui.snip=el('textarea','snip');ui.snip.readOnly=true;ui.snip.rows=4;ui.snip.style.display='none';b.raw('',ui.snip);
  b.note('player .html = this whole tool with the scene baked in and the panel removed. fully interactive, self-contained, works in an iframe. the snippet is the light version: it needs this file hosted and leaves out uploaded files.');
  b.sub('wallpaper / screensaver');
  b.raw('',actBtn('save wallpaper .html',()=>savePlayer('wallpaper')));
  b.note('a browser cannot write a .scr. drop the saved .html into <a href="https://www.rocksdanister.com/lively/" target="_blank" rel="noopener">Lively Wallpaper</a> (free, open source): it runs as an interactive desktop wallpaper, and Lively can use any wallpaper as the Windows screensaver.');
  b.sub('scene');
  const s=el('div','acts');s.append(actBtn('save scene',saveScene),actBtn('load scene',filePick('.json',false,importFiles)));b.raw('',s);
});

paintStops();
function savePNG(){cv.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='glyphlux-'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);say('saved '+a.download+' ('+W+'x'+H+')')},'image/png')}
function clearAll(){fxReinit();wa.fill(0);wb.fill(0);trail.fill(0);fvx.fill(0);fvy.fill(0);bursts=[];say('cleared')}
function toggleRack(){document.body.classList.toggle('hid');resize()}
$('#tab').onclick=toggleRack;
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    if(e.key==='='||e.key==='+'){zoomTo(Zt*1.25);e.preventDefault();return}
    if(e.key==='-'||e.key==='_'){zoomTo(Zt/1.25);e.preventDefault();return}
    if(e.key==='0'){zoomFit();e.preventDefault();return}}
  if(PLAY||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'&&!spaceHeld){spaceHeld=true;didPan=false;document.body.classList.add('pan');const fa=document.activeElement;if(fa&&fa!==document.body&&fa.blur)fa.blur()}
  if(e.code==='Space'){e.preventDefault()}
  else if(e.key==='h')toggleRack();else if(e.key==='p')savePNG();else if(e.key==='c')clearAll();else if(e.key==='r')toggleRec();else if(e.key==='t')txTrigger();
});
addEventListener('keyup',e=>{
  if(e.code!=='Space')return;spaceHeld=false;document.body.classList.remove('pan');
  if(PLAY||didPan||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  paused=!paused;say(paused?'frozen':'running')});
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drop')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});
new ResizeObserver(()=>{
  if(P.size==='fit'&&(stage.clientWidth!==W||stage.clientHeight!==H)&&P.zoomFit)resize();
  else{if(P.zoomFit){Zt=zfit();Z=Zt}layout()}}).observe(stage);
$('#zin').onclick=()=>zoomTo(Zt*1.25);$('#zout').onclick=()=>zoomTo(Zt/1.25);
$('#zfit').onclick=zoomFit;$('#z100').onclick=()=>zoomTo(1);
$('#zsl').append(slider(.1,2,.01,()=>Zt,v=>zoomTo(v),1));

/* ------------------------------------------------------------------ loop */
let fpsA=60,readT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;if(dt>0)fpsA+=(1/dt-fpsA)*.05;
  if(Math.abs(Z-Zt)>.0005){Z+=(Zt-Z)*.28;if(Math.abs(Z-Zt)<=.0005)Z=Zt;
    if(anchor){panX=anchor[2]-anchor[0]*Z;panY=anchor[3]-anchor[1]*Z}layout()}
  audioTick(dt);
  txTick(dt);
  if(!paused)step(dt);
  fxTick(dt);
  draw();
  gifGrab(now);if(rec&&now-readT>240)say('recording '+((now-recT0)/1000).toFixed(1)+'s');
  if(now-readT>250){readT=now;
    $('#read').innerHTML='fps <b>'+String(Math.round(fpsA)).padStart(3)+'</b>  grid <b>'+gw+'x'+gh+'</b>  ptc <b>'+(P.ptcOn?P.count:0)+'</b>  fx <b>'+FXA.length+(LGON?' +logo':'')+(WARPA.length?'+'+WARPA.length+'w':'')+'</b>'}
}
setPalette();resize();
if(BOOT)applyState(BOOT).then(()=>{if(!PLAY)say('scene restored')});
if(document.fonts&&document.fonts.load)document.fonts.load('16px '+PXQ).then(()=>{if(P.face==='px437'){lastFace=null;regrid()}});
if(document.fonts&&document.fonts.load)document.fonts.load('11px "Departure Mono"').then(()=>{INK.clear();for(const k in RAMPC)delete RAMPC[k];logoSig='';regrid()});
requestAnimationFrame(frame);
})();
</script>
